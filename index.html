<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Seller Center FAQ - Shopee Style</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        /* Shopee Theme Colors */
        :root {
            --primary: #ee4d2d;
            --primary-dark: #d73211;
            --primary-light: #ff6b4a;
            --secondary: #ffc107;
            --text-dark: #222222;
            --text-gray: #757575;
            --text-light: #999999;
            --border: #e8e8e8;
            --bg-gray: #f5f5f5;
            --white: #ffffff;
            --shadow: 0 1px 4px rgba(0,0,0,0.08);
            --shadow-hover: 0 4px 12px rgba(0,0,0,0.12);
        }

        /* App Container */
        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar - Shopee Style */
        .sidebar {
            width: 280px;
            background: var(--white);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--primary);
        }

        .logo-text h1 {
            font-size: 18px;
            color: white;
            font-weight: 600;
        }

        .logo-text p {
            font-size: 11px;
            color: rgba(255,255,255,0.8);
            margin-top: 2px;
        }

        /* Menu Navigation */
        .menu-nav {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
        }

        .menu-category {
            margin-bottom: 8px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-dark);
            font-size: 14px;
            position: relative;
        }

        .menu-item:hover {
            background: #fafafa;
        }

        .menu-item.active {
            background: #fff5f2;
            color: var(--primary);
            border-right: 3px solid var(--primary);
        }

        .menu-item i {
            width: 20px;
            font-size: 16px;
            color: var(--text-gray);
        }

        .menu-item.active i {
            color: var(--primary);
        }

        .menu-item .fa-chevron-down,
        .menu-item .fa-chevron-right {
            margin-left: auto;
            font-size: 12px;
        }

        .submenu {
            margin-left: 32px;
            display: none;
        }

        .submenu.open {
            display: block;
        }

        .submenu .menu-item {
            padding: 10px 20px;
            font-size: 13px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-gray);
        }

        /* Header Shopee Style */
        .main-header {
            background: var(--white);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .page-title .badge {
            background: #fff5f2;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        /* Search Box */
        .search-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-gray);
            border-radius: 8px;
            padding: 8px 16px;
            width: 280px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .search-box:focus-within {
            background: var(--white);
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(238,77,45,0.1);
        }

        .search-box i {
            color: var(--text-gray);
            margin-right: 8px;
        }

        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 14px;
        }

        .search-box input::placeholder {
            color: var(--text-light);
        }

        /* Manual Reload Button */
        .reload-btn {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .reload-btn:hover {
            background: #fafafa;
            border-color: var(--primary);
            color: var(--primary);
        }

        /* FAQ Container */
        .faq-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* FAQ Card - Shopee Style */
        .faq-card {
            background: var(--white);
            border-radius: 8px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            transition: all 0.2s;
            border: 1px solid var(--border);
        }

        .faq-card:hover {
            box-shadow: var(--shadow-hover);
        }

        .faq-question {
            padding: 18px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            color: var(--text-dark);
            font-size: 15px;
        }

        .faq-question i {
            color: var(--text-light);
            transition: transform 0.2s;
        }

        .faq-question .fa-chevron-up {
            color: var(--primary);
        }

        .faq-answer {
            padding: 0 20px 18px 20px;
            border-top: 1px solid var(--border);
            display: none;
            line-height: 1.6;
            color: var(--text-gray);
            font-size: 14px;
        }

        .faq-answer.open {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* Empty & Loading States */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--white);
            border-radius: 8px;
            color: var(--text-gray);
        }

        .empty-state i {
            font-size: 64px;
            color: var(--border);
            margin-bottom: 16px;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        .error-state {
            text-align: center;
            padding: 40px 20px;
            background: #fff5f2;
            border-radius: 8px;
            color: var(--primary);
        }

        /* Highlight Search */
        .highlight {
            background: #fff3cd;
            padding: 0 2px;
            border-radius: 3px;
            color: #856404;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--border);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border-radius: 10px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                width: 280px;
                height: 100vh;
                z-index: 1000;
                transition: left 0.3s ease;
                box-shadow: 2px 0 12px rgba(0,0,0,0.1);
            }

            .sidebar.mobile-open {
                left: 0;
            }

            .main-header {
                padding: 12px 16px;
            }

            .page-title h2 {
                font-size: 18px;
            }

            .search-box {
                width: 200px;
            }

            .faq-container {
                padding: 16px;
            }

            /* Mobile Menu Toggle */
            .mobile-menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 40px;
                height: 40px;
                background: var(--white);
                border-radius: 8px;
                cursor: pointer;
                margin-right: 8px;
            }
        }

        @media (min-width: 769px) {
            .mobile-menu-toggle {
                display: none;
            }
            .sidebar-overlay {
                display: none;
            }
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        .sidebar-overlay.show {
            display: block;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1100;
            animation: slideInRight 0.3s ease;
            box-shadow: var(--shadow-hover);
        }

        .toast.success { background: #28a745; }
        .toast.error { background: var(--primary); }
        .toast.info { background: #17a2b8; }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Mobile Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-store"></i>
                </div>
                <div class="logo-text">
                    <h1>Seller Center</h1>
                    <p>FAQ & Panduan</p>
                </div>
            </div>
        </div>
        <nav class="menu-nav" id="menuNav">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>Memuat menu...</p>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="main-header">
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="mobile-menu-toggle" id="mobileMenuToggle">
                    <i class="fas fa-bars" style="font-size: 20px;"></i>
                </div>
                <div class="page-title">
                    <h2 id="pageTitle">FAQ Seller Center</h2>
                    <span class="badge" id="faqCount"></span>
                </div>
            </div>
            <div class="search-wrapper">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Cari pertanyaan..." autocomplete="off">
                </div>
                <button class="reload-btn" id="reloadBtn">
                    <i class="fas fa-sync-alt"></i>
                    <span>Refresh</span>
                </button>
            </div>
        </header>
        <div class="faq-container" id="faqContainer">
            <div class="empty-state">
                <i class="fas fa-folder-open"></i>
                <p>Pilih menu di sidebar untuk melihat FAQ</p>
            </div>
        </div>
    </main>
</div>

<script>
    // ==================== KONFIGURASI ====================
    const CONFIG = {
        BASE_URL: "https://script.google.com/macros/s/AKfycbwKJUJieEWG91Bu_FQsgJxV4FSvUTJCFbbByfuTh0FQk12eRk2WqZH4wLLiqYsXWMPL/exec",
        DEBUG: false
    };

    // ==================== DATA STORE (hanya diambil sekali) ====================
    let STORE = {
        menuTree: [],
        allFaqs: [],
        menuFaqMap: new Map(),
        isDataLoaded: false,
        currentMenuId: null,
        currentSearchKeyword: ''
    };

    // ==================== HELPER FUNCTIONS ====================
    function showToast(message, type = 'info') {
        const existingToast = document.querySelector('.toast');
        if (existingToast) existingToast.remove();
        
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ==================== API CALL (hanya sekali) ====================
    async function fetchAllData() {
        if (STORE.isDataLoaded) {
            console.log('Data sudah loaded, skip fetch');
            return true;
        }

        try {
            showToast('Mengambil data...', 'info');
            
            // Fetch menu tree
            const menuUrl = `${CONFIG.BASE_URL}?action=menu`;
            const menuResponse = await fetch(menuUrl);
            const menuData = await menuResponse.json();
            
            if (!menuData.success) throw new Error(menuData.message || 'Gagal mengambil menu');
            STORE.menuTree = Array.isArray(menuData.data) ? menuData.data : [];
            
            // Fetch all FAQs (tanpa filter menu)
            const faqUrl = `${CONFIG.BASE_URL}?action=faq&menuId=all`;
            const faqResponse = await fetch(faqUrl);
            const faqData = await faqResponse.json();
            
            let allFaqsRaw = [];
            if (faqData.success && Array.isArray(faqData.data)) {
                allFaqsRaw = faqData.data;
            } else {
                // Fallback: ambil per menu jika endpoint all tidak tersedia
                for (const menu of STORE.menuTree) {
                    const singleUrl = `${CONFIG.BASE_URL}?action=faq&menuId=${menu.id}`;
                    const singleResp = await fetch(singleUrl);
                    const singleData = await singleResp.json();
                    if (singleData.success && Array.isArray(singleData.data)) {
                        allFaqsRaw.push(...singleData.data);
                    }
                }
            }
            
            STORE.allFaqs = allFaqsRaw;
            
            // Build map menuId -> FAQs
            STORE.menuFaqMap.clear();
            for (const faq of STORE.allFaqs) {
                const menuId = String(faq.menu_id);
                if (!STORE.menuFaqMap.has(menuId)) {
                    STORE.menuFaqMap.set(menuId, []);
                }
                STORE.menuFaqMap.get(menuId).push(faq);
            }
            
            STORE.isDataLoaded = true;
            showToast(`Berhasil memuat ${STORE.menuTree.length} menu & ${STORE.allFaqs.length} FAQ`, 'success');
            return true;
            
        } catch (error) {
            console.error('Fetch error:', error);
            showToast('Gagal memuat data: ' + error.message, 'error');
            return false;
        }
    }

    // ==================== RENDER MENU TREE ====================
    function buildTree(items, parentId = "0") {
        return items
            .filter(item => String(item.parent_id) === String(parentId))
            .map(item => ({
                id: item.id,
                nama: item.nama,
                children: buildTree(items, item.id)
            }));
    }

    function renderMenu() {
        const container = document.getElementById('menuNav');
        if (!container) return;
        
        if (!STORE.menuTree || STORE.menuTree.length === 0) {
            container.innerHTML = '<div class="empty-state" style="padding: 20px;"><i class="fas fa-folder-open"></i><p>Tidak ada menu</p></div>';
            return;
        }
        
        const tree = buildTree(STORE.menuTree, "0");
        
        function renderMenuItem(node, level = 0) {
            const hasChildren = node.children && node.children.length > 0;
            const div = document.createElement('div');
            div.className = 'menu-category';
            
            const menuDiv = document.createElement('div');
            menuDiv.className = 'menu-item';
            menuDiv.setAttribute('data-id', node.id);
            menuDiv.style.paddingLeft = `${16 + (level * 16)}px`;
            
            const icon = document.createElement('i');
            icon.className = hasChildren ? 'fas fa-folder' : 'fas fa-file-alt';
            menuDiv.appendChild(icon);
            
            const span = document.createElement('span');
            span.textContent = node.nama;
            menuDiv.appendChild(span);
            
            if (hasChildren) {
                const toggleIcon = document.createElement('i');
                toggleIcon.className = 'fas fa-chevron-right';
                toggleIcon.style.cursor = 'pointer';
                toggleIcon.onclick = (e) => {
                    e.stopPropagation();
                    const submenu = div.querySelector('.submenu');
                    if (submenu) {
                        submenu.classList.toggle('open');
                        toggleIcon.classList.toggle('fa-chevron-down');
                        toggleIcon.classList.toggle('fa-chevron-right');
                    }
                };
                menuDiv.appendChild(toggleIcon);
            }
            
            menuDiv.onclick = (e) => {
                if (e.target.classList.contains('fa-chevron-right') || e.target.classList.contains('fa-chevron-down')) return;
                setActiveMenu(node.id);
                loadFaqByMenuId(node.id);
                document.getElementById('pageTitle').innerHTML = node.nama;
                document.getElementById('searchInput').value = '';
                STORE.currentSearchKeyword = '';
            };
            
            div.appendChild(menuDiv);
            
            if (hasChildren) {
                const submenu = document.createElement('div');
                submenu.className = 'submenu';
                node.children.forEach(child => {
                    submenu.appendChild(renderMenuItem(child, level + 1));
                });
                div.appendChild(submenu);
            }
            
            return div;
        }
        
        container.innerHTML = '';
        tree.forEach(item => {
            container.appendChild(renderMenuItem(item));
        });
    }
    
    function setActiveMenu(id) {
        document.querySelectorAll('.menu-item').forEach(item => {
            item.classList.remove('active');
            if (item.getAttribute('data-id') === String(id)) {
                item.classList.add('active');
            }
        });
        STORE.currentMenuId = id;
    }
    
    // ==================== RENDER FAQ ====================
    function loadFaqByMenuId(menuId) {
        const container = document.getElementById('faqContainer');
        const faqCountSpan = document.getElementById('faqCount');
        
        const faqs = STORE.menuFaqMap.get(String(menuId)) || [];
        
        if (faqs.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-comment-dots"></i>
                    <p>Tidak ada FAQ untuk menu ini</p>
                </div>
            `;
            faqCountSpan.textContent = '';
            return;
        }
        
        faqCountSpan.textContent = `${faqs.length} pertanyaan`;
        
        container.innerHTML = '';
        faqs.forEach(faq => {
            const card = document.createElement('div');
            card.className = 'faq-card';
            
            const questionDiv = document.createElement('div');
            questionDiv.className = 'faq-question';
            questionDiv.innerHTML = `
                <span>${escapeHtml(faq.pertanyaan)}</span>
                <i class="fas fa-chevron-down"></i>
            `;
            
            const answerDiv = document.createElement('div');
            answerDiv.className = 'faq-answer';
            answerDiv.innerHTML = (faq.jawaban || '').replace(/\n/g, '<br>');
            
            questionDiv.onclick = () => {
                answerDiv.classList.toggle('open');
                const icon = questionDiv.querySelector('i');
                if (answerDiv.classList.contains('open')) {
                    icon.className = 'fas fa-chevron-up';
                } else {
                    icon.className = 'fas fa-chevron-down';
                }
            };
            
            card.appendChild(questionDiv);
            card.appendChild(answerDiv);
            container.appendChild(card);
        });
    }
    
    // ==================== SEARCH ====================
    function searchFaq(keyword) {
        if (!keyword.trim()) {
            if (STORE.currentMenuId) {
                loadFaqByMenuId(STORE.currentMenuId);
            } else {
                document.getElementById('faqContainer').innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><p>Pilih menu terlebih dahulu</p></div>';
            }
            return;
        }
        
        const container = document.getElementById('faqContainer');
        const keywordLower = keyword.toLowerCase();
        
        // Search across all FAQs
        const results = STORE.allFaqs.filter(faq => 
            (faq.pertanyaan && faq.pertanyaan.toLowerCase().includes(keywordLower)) ||
            (faq.jawaban && faq.jawaban.toLowerCase().includes(keywordLower))
        );
        
        const faqCountSpan = document.getElementById('faqCount');
        faqCountSpan.textContent = `${results.length} hasil`;
        document.getElementById('pageTitle').innerHTML = `Hasil pencarian: "${keyword}"`;
        
        if (results.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-search"></i>
                    <p>Tidak ditemukan hasil untuk "${escapeHtml(keyword)}"</p>
                </div>
            `;
            return;
        }
        
        const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        
        container.innerHTML = '';
        results.forEach(faq => {
            const card = document.createElement('div');
            card.className = 'faq-card';
            
            let highlightedQuestion = escapeHtml(faq.pertanyaan).replace(regex, `<mark class="highlight">$1</mark>`);
            let highlightedAnswer = escapeHtml(faq.jawaban || '').replace(regex, `<mark class="highlight">$1</mark>`).replace(/\n/g, '<br>');
            
            const questionDiv = document.createElement('div');
            questionDiv.className = 'faq-question';
            questionDiv.innerHTML = `<span>${highlightedQuestion}</span><i class="fas fa-chevron-down"></i>`;
            
            const answerDiv = document.createElement('div');
            answerDiv.className = 'faq-answer';
            answerDiv.innerHTML = highlightedAnswer;
            
            questionDiv.onclick = () => {
                answerDiv.classList.toggle('open');
                const icon = questionDiv.querySelector('i');
                if (answerDiv.classList.contains('open')) {
                    icon.className = 'fas fa-chevron-up';
                } else {
                    icon.className = 'fas fa-chevron-down';
                }
            };
            
            card.appendChild(questionDiv);
            card.appendChild(answerDiv);
            container.appendChild(card);
        });
    }
    
    // ==================== MANUAL RELOAD ====================
    async function manualReload() {
        showToast('Memuat ulang data...', 'info');
        STORE.isDataLoaded = false;
        STORE.menuTree = [];
        STORE.allFaqs = [];
        STORE.menuFaqMap.clear();
        
        const success = await fetchAllData();
        if (success) {
            renderMenu();
            if (STORE.menuTree.length > 0) {
                const firstMenu = STORE.menuTree[0];
                setActiveMenu(firstMenu.id);
                loadFaqByMenuId(firstMenu.id);
                document.getElementById('pageTitle').innerHTML = firstMenu.nama;
            }
            showToast('Data berhasil diperbarui!', 'success');
        } else {
            showToast('Gagal memuat ulang data', 'error');
        }
    }
    
    // ==================== INITIALIZATION ====================
    async function init() {
        // Mobile menu toggle
        const mobileToggle = document.getElementById('mobileMenuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        
        function closeMobileMenu() {
            sidebar.classList.remove('mobile-open');
            overlay.classList.remove('show');
        }
        
        function openMobileMenu() {
            sidebar.classList.add('mobile-open');
            overlay.classList.add('show');
        }
        
        if (mobileToggle) {
            mobileToggle.onclick = openMobileMenu;
        }
        
        if (overlay) {
            overlay.onclick = closeMobileMenu;
        }
        
        // Reload button
        const reloadBtn = document.getElementById('reloadBtn');
        if (reloadBtn) {
            reloadBtn.onclick = manualReload;
        }
        
        // Search input
        const searchInput = document.getElementById('searchInput');
        let searchTimeout;
        if (searchInput) {
            searchInput.oninput = (e) => {
                clearTimeout(searchTimeout);
                const keyword = e.target.value;
                STORE.currentSearchKeyword = keyword;
                searchTimeout = setTimeout(() => {
                    searchFaq(keyword);
                }, 400);
            };
        }
        
        // Load data pertama kali saja
        const success = await fetchAllData();
        if (success) {
            renderMenu();
            if (STORE.menuTree.length > 0) {
                const firstMenu = STORE.menuTree[0];
                setActiveMenu(firstMenu.id);
                loadFaqByMenuId(firstMenu.id);
                document.getElementById('pageTitle').innerHTML = firstMenu.nama;
            }
        }
    }
    
    // Start the app
    init();
</script>
</body>
</html>
