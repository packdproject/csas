<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HelpDesk Seller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --surface: #f0f2f5;
            --primary: #3390ec;
            --text: #000000;
            --text-secondary: #5e6672;
            --border: #e7e9ec;
            --card: #ffffff;
            --hover: #f4f4f5;
        }

        body.dark {
            --bg: #0f0f12;
            --surface: #1c1c1e;
            --primary: #53a9ff;
            --text: #ffffff;
            --text-secondary: #aaaab3;
            --border: #2c2c30;
            --card: #252528;
            --hover: #2c2c30;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .sidebar {
            width: 300px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
            transition: transform 0.25s ease;
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .logo-icon {
            background: var(--primary);
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .reload-btn {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            font-weight: 500;
            color: var(--text);
        }

        .nav-tree {
            padding: 12px 8px;
        }

        .tree-item {
            list-style: none;
            margin-bottom: 2px;
        }

        .tree-node {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .tree-node-content {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .tree-node:hover {
            background: var(--hover);
        }

        .tree-node.active {
            background: var(--primary);
            color: white;
        }

        .collapse-icon {
            width: 24px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
        }

        .children-list {
            padding-left: 28px;
        }

        .children-list.collapsed {
            display: none;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-header {
            padding: 16px 24px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .title-area h2 {
            font-size: 1.3rem;
        }

        .title-area p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .theme-toggle, .mobile-menu-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 500;
        }

        .mobile-menu-btn {
            display: none;
        }

        .search-section {
            padding: 16px 24px 8px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            background: var(--surface);
            border-radius: 44px;
            padding: 6px 18px;
            border: 1px solid var(--border);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.95rem;
            padding: 10px 0;
            color: var(--text);
        }

        .search-box button {
            background: var(--primary);
            border: none;
            border-radius: 30px;
            padding: 6px 20px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .faq-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px 30px;
        }

        .faq-card {
            background: var(--card);
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .faq-question {
            padding: 16px 20px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .faq-question:hover {
            background: var(--hover);
        }

        .copy-btn {
            background: var(--surface);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: var(--primary);
            color: white;
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease-out;
            background: var(--surface);
            border-top: 1px solid transparent;
        }

        .faq-answer.open {
            max-height: 800px;
            padding: 18px 20px;
            border-top: 1px solid var(--border);
        }

        .answer-content {
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        @media (max-width: 680px) {
            .sidebar {
                position: fixed;
                z-index: 100;
                transform: translateX(-100%);
                width: 280px;
                height: 100%;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .mobile-menu-btn {
                display: block;
            }
            .overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.4);
                z-index: 90;
            }
            .overlay.open {
                display: block;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">📘</div>
                <div class="logo-text">HelpDesk Seller</div>
            </div>
            <button class="reload-btn" id="reloadBtn">⟳ Muat Ulang</button>
        </div>
        <div class="nav-tree" id="menuTree"></div>
    </div>
    <div class="main">
        <div class="main-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                <div class="title-area">
                    <h2 id="pageTitle">HelpDesk Seller</h2>
                    <p id="pageSub">Pusat Bantuan Multi Seller</p>
                </div>
            </div>
            <button class="theme-toggle" id="themeToggle">🌓 Mode</button>
        </div>
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari pertanyaan atau jawaban...">
                <button id="searchBtn">Cari</button>
            </div>
        </div>
        <div class="faq-container" id="faqContainer">
            <div class="empty-state">✨ Pilih kategori dari menu samping</div>
        </div>
    </div>
    <div class="overlay" id="overlay"></div>
</div>

<script>
    // 🔴 GANTI DENGAN URL APPS SCRIPT ANDA 🔴
    const API = "https://script.google.com/macros/s/AKfycbzluMD77v-V1F1Z7hfh1Ci584gFv9FStTglKajKG-7y2VyT853jUUah5NS5LcREPbGU/exec";
    
    let menuTree = [];
    let allFaqs = [];
    let currentMenuId = "0";
    let currentMenuName = "Semua FAQ";

    async function fetchAPI(action, params = {}) {
        const url = new URL(API);
        url.searchParams.append("action", action);
        Object.keys(params).forEach(k => {
            if (params[k] !== undefined && params[k] !== "") {
                url.searchParams.append(k, params[k]);
            }
        });
        
        const resp = await fetch(url.toString());
        const json = await resp.json();
        if (!json.success) throw new Error(json.message || "Gagal");
        return json.data;
    }

    async function loadAll() {
        try {
            menuTree = await fetchAPI("menu");
            allFaqs = await fetchAPI("search", { q: "" });
            renderMenuTree(menuTree);
            renderFaqs();
        } catch (err) {
            document.getElementById("faqContainer").innerHTML = `<div class="empty-state">❌ Error: ${err.message}</div>`;
        }
    }

    function renderMenuTree(tree) {
        const container = document.getElementById("menuTree");
        
        const build = (nodes, level = 0) => {
            let html = '<ul style="list-style:none; padding-left: 0;">';
            for (const node of nodes) {
                const hasChildren = node.children && node.children.length > 0;
                const isActive = currentMenuId === node.id;
                
                html += `<li class="tree-item">
                    <div class="tree-node ${isActive ? 'active' : ''}" data-id="${node.id}" data-name="${escapeHtml(node.nama)}">
                        <div class="tree-node-content">
                            <span>${level === 0 ? '📁' : '📄'}</span>
                            <span>${escapeHtml(node.nama) || '(tanpa nama)'}</span>
                        </div>`;
                
                if (hasChildren) {
                    html += `<span class="collapse-icon" data-id="${node.id}">▼</span>`;
                }
                
                html += `</div>`;
                
                if (hasChildren) {
                    html += `<div class="children-list" id="children-${node.id}">${build(node.children, level + 1)}</div>`;
                }
                
                html += `</li>`;
            }
            html += `</ul>`;
            return html;
        };
        
        container.innerHTML = build(tree);
        
        document.querySelectorAll('.tree-node').forEach(el => {
            const id = el.getAttribute('data-id');
            const name = el.getAttribute('data-name');
            el.addEventListener('click', (e) => {
                if (e.target.classList.contains('collapse-icon')) return;
                setActiveMenu(id, name);
                if (window.innerWidth <= 680) closeSidebar();
            });
        });
        
        document.querySelectorAll('.collapse-icon').forEach(icon => {
            icon.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = icon.closest('.tree-node').getAttribute('data-id');
                const childList = document.getElementById(`children-${id}`);
                if (childList) {
                    childList.classList.toggle('collapsed');
                    icon.textContent = childList.classList.contains('collapsed') ? '▶' : '▼';
                }
            });
        });
    }

    function setActiveMenu(id, name) {
        currentMenuId = id;
        currentMenuName = name;
        document.getElementById("pageTitle").innerText = name || "Semua FAQ";
        document.getElementById("pageSub").innerText = id === "0" ? "Semua pertanyaan" : `FAQ untuk ${name || 'kategori ini'}`;
        
        document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('active'));
        const activeNode = document.querySelector(`.tree-node[data-id="${id}"]`);
        if (activeNode) activeNode.classList.add('active');
        
        document.getElementById("searchInput").value = "";
        renderFaqs();
    }

    function renderFaqs() {
        const container = document.getElementById("faqContainer");
        let filtered = [...allFaqs];
        
        const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
        if (keyword) {
            filtered = allFaqs.filter(f => 
                (f.pertanyaan || "").toLowerCase().includes(keyword) || 
                (f.jawaban || "").toLowerCase().includes(keyword)
            );
        } else if (currentMenuId !== "0") {
            filtered = allFaqs.filter(f => String(f.menu_id) === String(currentMenuId));
        }
        
        if (!filtered.length) {
            container.innerHTML = `<div class="empty-state">📭 Tidak ada FAQ untuk kategori ini</div>`;
            return;
        }
        
        let html = '';
        filtered.forEach((faq, idx) => {
            const answerId = `ans-${idx}`;
            let jawabanHtml = '';
            
            if (faq.jawaban_list && faq.jawaban_list.length) {
                jawabanHtml = `<div class="answer-content">${faq.jawaban_list.map((j, i) => `${i+1}. ${escapeHtml(j)}`).join('<br><br>')}</div>`;
            } else {
                jawabanHtml = `<div class="answer-content">${escapeHtml(faq.jawaban || "Jawaban belum tersedia")}</div>`;
            }
            
            html += `
                <div class="faq-card">
                    <div class="faq-question" data-target="${answerId}">
                        <span>❓ ${escapeHtml(faq.pertanyaan || "Pertanyaan tidak tersedia")}</span>
                        <span class="copy-btn" data-copy='${JSON.stringify(faq.jawaban_list || [faq.jawaban])}'>📋 Salin</span>
                    </div>
                    <div class="faq-answer" id="${answerId}">
                        ${jawabanHtml}
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
        
        document.querySelectorAll('.faq-question').forEach(q => {
            const targetId = q.getAttribute('data-target');
            const answerDiv = document.getElementById(targetId);
            
            q.addEventListener('click', (e) => {
                if (e.target.classList.contains('copy-btn')) return;
                answerDiv.classList.toggle('open');
            });
            
            const copyBtn = q.querySelector('.copy-btn');
            if (copyBtn) {
                copyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const data = copyBtn.getAttribute('data-copy');
                    let textToCopy = '';
                    try {
                        const parsed = JSON.parse(data);
                        textToCopy = Array.isArray(parsed) ? parsed.map((j, i) => `${i+1}. ${j}`).join('\n') : parsed;
                    } catch { textToCopy = data; }
                    
                    navigator.clipboard.writeText(textToCopy);
                    const original = copyBtn.innerHTML;
                    copyBtn.innerHTML = '✅ Tersalin!';
                    setTimeout(() => copyBtn.innerHTML = original, 1500);
                });
            }
        });
    }

    function searchFaq() {
        const keyword = document.getElementById("searchInput").value.trim();
        if (keyword) {
            currentMenuId = "0";
            document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('active'));
            renderFaqs();
        } else {
            setActiveMenu(currentMenuId, currentMenuName);
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }

    // Theme
    const themeToggle = document.getElementById("themeToggle");
    themeToggle.onclick = () => {
        document.body.classList.toggle("dark");
        localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    };
    if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark");

    // Mobile
    const mobileBtn = document.getElementById("mobileMenuBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    function openSidebar() { sidebar.classList.add("open"); overlay.classList.add("open"); }
    function closeSidebar() { sidebar.classList.remove("open"); overlay.classList.remove("open"); }
    mobileBtn.onclick = openSidebar;
    overlay.onclick = closeSidebar;

    document.getElementById("reloadBtn").onclick = () => loadAll();
    document.getElementById("searchBtn").onclick = searchFaq;
    document.getElementById("searchInput").addEventListener("keypress", e => e.key === "Enter" && searchFaq());

    loadAll();
</script>
</body>
</html>
