<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Dashboard - FAQ Seller</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <img src="assets/logo.png" alt="Logo" class="logo" onerror="this.src='https://via.placeholder.com/40x40?text=CS'">
                <h2>CS Dashboard</h2>
            </div>
            <nav class="menu-tree" id="menuTree">
                <div class="loading">Memuat menu...</div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1 id="pageTitle">FAQ Seller</h1>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Cari pertanyaan atau jawaban...">
                </div>
            </header>
            <div class="faq-container" id="faqContainer">
                <div class="empty-state">Pilih menu di sidebar untuk melihat FAQ</div>
            </div>
        </main>
    </div>

    <!-- URUTAN LOADING PENTING! -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/faq.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/search.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
