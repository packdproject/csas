<html lang="id">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #ffffff;
            --surface: #f0f2f5;
            --primary: #3390ec;
            --text: #000000;
            --text-secondary: #5e6672;
            --border: #e7e9ec;
            --card: #ffffff;
        }
        body.dark {
            --bg: #0f0f12;
            --surface: #1c1c1e;

            --text: #ffffff;
            --text-secondary: #aaaab3;
            --border: #2c2c30;
            --card: #252528;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        .app { display: flex; height: 100vh; width: 100%; }
        .sidebar { width: 300px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; transition: transform 0.25s ease; }
        .sidebar-header { padding: 20px 16px; border-bottom: 1px solid var(--border); }
        .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .logo-icon { background: var(--primary); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .logo-text { font-weight: 700; font-size: 1.2rem; }
        .reload-btn { background: var(--card); border: 1px solid var(--border); border-radius: 40px; padding: 10px; width: 100%; cursor: pointer; font-weight: 500; color: var(--text); }
        .nav-tree { padding: 12px 8px; }
        .tree-item { list-style: none; margin-bottom: 2px; }
        .tree-node { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px; cursor: pointer; font-size: 0.9rem; }
        .tree-node-content { display: flex; align-items: center; gap: 10px; flex: 1; }
        .tree-node:hover { background: var(--surface); background: #e8e8ed; }
        body.dark .tree-node:hover { background: #2c2c30; }
        .tree-node.active { background: var(--primary); color: white; }
        .collapse-icon { width: 24px; text-align: center; cursor: pointer; font-size: 12px; }
        .children-list { padding-left: 28px; }
        .children-list.collapsed { display: none; }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .main-header { padding: 16px 24px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .title-area h2 { font-size: 1.3rem; }
        .title-area p { font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; }
        .theme-toggle, .mobile-menu-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 30px; padding: 8px 16px; cursor: pointer; font-weight: 500; }
        .mobile-menu-btn { display: none; }
        .search-section { padding: 16px 24px 8px; }
        .search-box { display: flex; gap: 10px; background: var(--surface); border-radius: 44px; padding: 6px 18px; border: 1px solid var(--border); }
        .search-box input { flex: 1; background: transparent; border: none; outline: none; font-size: 0.95rem; padding: 10px 0; color: var(--text); }
        .search-box button { background: var(--primary); border: none; border-radius: 30px; padding: 6px 20px; color: white; font-weight: 600; cursor: pointer; }
        .faq-container { flex: 1; overflow-y: auto; padding: 16px 24px 30px; }
        .faq-card { background: var(--card); border-radius: 16px; margin-bottom: 16px; border: 1px solid var(--border); overflow: hidden; }
        .faq-question { padding: 16px 20px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .faq-question:hover { background: var(--surface); }
        .copy-all-btn { background: var(--surface); padding: 6px 14px; border-radius: 40px; font-size: 0.7rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
        .copy-all-btn:hover { background: var(--primary); color: white; }
        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.25s ease-out; background: var(--surface); border-top: 1px solid transparent; }
        .faq-answer.open { max-height: 800px; padding: 18px 20px; border-top: 1px solid var(--border); }
        .answer-item { margin-bottom: 12px; padding: 8px 12px; background: var(--bg); border-radius: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .answer-text { flex: 1; line-height: 1.5; }
        .copy-single-btn { background: var(--surface); padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; cursor: pointer; }
        .copy-single-btn:hover { background: var(--primary); color: white; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
