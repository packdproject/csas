<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Seller Support Hub - Dashboard FAQ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.25s ease, color 0.2s ease, border-color 0.2s ease;
        }

        /* ROOT VARIABLES - Light Mode (Default) */
        :root {
            --bg-body: #f5f7fb;
            --bg-surface: #ffffff;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --bg-hover: #f0f2f5;
            --text-primary: #1f2a3e;
            --text-secondary: #5b6e8c;
            --text-muted: #8a99b4;
            --border: #e9eef3;
            --accent: #2c7da0;
            --accent-light: #e1f0f5;
            --accent-hover: #1f5e7a;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.05);
            --toast-bg: #1e293b;
            --toast-text: #ffffff;
            --code-bg: #f8fafc;
        }

        /* DARK MODE */
        body.dark {
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --bg-sidebar: #1e293b;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #5dade2;
            --accent-light: #1f3a4b;
            --accent-hover: #7ab3c8;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.4);
            --toast-bg: #f1f5f9;
            --toast-text: #0f172a;
            --code-bg: #0f172a;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 10;
            box-shadow: var(--shadow-sm);
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-placeholder {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            color: white;
        }

        .sidebar-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .nav-menu {
            flex: 1;
            padding: 20px 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border-radius: 14px;
            margin-bottom: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 600;
        }

        .nav-icon {
            font-size: 1.3rem;
            width: 28px;
        }

        /* menu child indentation */
        .nav-child {
            margin-left: 42px;
            font-size: 0.9rem;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .theme-toggle, .reload-btn {
            background: var(--bg-hover);
            border: none;
            padding: 8px 12px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .theme-toggle:hover, .reload-btn:hover {
            background: var(--border);
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .greeting h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .search-box {
            display: flex;
            gap: 8px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 48px;
            padding: 6px 6px 6px 18px;
            box-shadow: var(--shadow-sm);
        }

        .search-box input {
            background: transparent;
            border: none;
            padding: 10px 0;
            font-size: 0.9rem;
            width: 240px;
            outline: none;
            color: var(--text-primary);
        }

        .search-box button {
            background: var(--accent);
            border: none;
            border-radius: 40px;
            padding: 6px 20px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-box button:hover {
            background: var(--accent-hover);
        }

        /* FAQ cards */
        .faq-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .faq-card {
            background: var(--bg-card);
            border-radius: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.2s;
        }

        .faq-question {
            padding: 20px 24px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-surface);
            border-bottom: 1px solid transparent;
        }

        .faq-question span:first-child {
            flex: 1;
        }

        .chevron {
            font-size: 1.3rem;
            transition: transform 0.2s;
            color: var(--text-muted);
        }

        .faq-card.open .chevron {
            transform: rotate(180deg);
        }

        .faq-answer {
            padding: 0 24px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.2s;
            background: var(--bg-card);
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .faq-card.open .faq-answer {
            max-height: 800px;
            padding: 0 24px 24px 24px;
        }

        .answer-content {
            white-space: pre-wrap;
            background: var(--code-bg);
            padding: 16px;
            border-radius: 18px;
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .copy-btn {
            background: var(--accent-light);
            border: none;
            margin-top: 12px;
            padding: 8px 16px;
            border-radius: 32px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.15s;
        }

        .copy-btn:hover {
            background: var(--accent);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border-radius: 32px;
            color: var(--text-muted);
        }

        .toast-message {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            box-shadow: var(--shadow-md);
        }

        .loader {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 720px) {
            .sidebar {
                width: 90px;
            }
            .sidebar-header h2, .nav-item span:last-child, .nav-child span:last-child {
                display: none;
            }
            .nav-child {
                margin-left: 0;
            }
            .sidebar-footer .reload-btn span, .sidebar-footer .theme-toggle span {
                display: none;
            }
            .main-content {
                padding: 16px;
            }
            .search-box input {
                width: 140px;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="logo-placeholder">📘</div>
        <h2>Seller Hub</h2>
    </div>
    <div class="nav-menu" id="sidebarMenu">
        <!-- dynamic menu from API will be injected here -->
        <div class="loader" id="menuLoader" style="padding: 20px;"><div class="spinner"></div></div>
    </div>
    <div class="sidebar-footer">
        <button class="reload-btn" id="reloadDataBtn">🔄 <span>Reload Data</span></button>
        <button class="theme-toggle" id="themeToggleBtn">🌓 <span>Mode Gelap</span></button>
    </div>
</div>

<div class="main-content">
    <div class="top-bar">
        <div class="greeting">
            <h1 id="dashboardTitle">Semua FAQ</h1>
            <p id="menuDescription" style="color: var(--text-muted); font-size: 0.85rem;">Pilih menu di samping untuk melihat panduan</p>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari pertanyaan / jawaban..." autocomplete="off">
            <button id="searchBtn">Cari</button>
        </div>
    </div>
    <div id="faqContentArea">
        <div class="loader"><div class="spinner"></div></div>
    </div>
</div>

<div id="toastMsg" class="toast-message">✅ Tersalin</div>

<script>
    // ---------- KONFIGURASI ----------
    // GANTI DENGAN URL WEB APP SCRIPT YANG SESUAI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwKJUJieEWG91Bu_FQsgJxV4FSvUTJCFbbByfuTh0FQk12eRk2WqZH4wLLiqYsXWMPL/exec";

    // State Management
    let fullMenuTree = [];        // menyimpan tree menu untuk navigasi
    let flatMenuMap = new Map();  // mapping id -> menu item (termasuk children)
    let currentMenuId = null;     // menu id yang sedang aktif (null = all faq)
    let faqCache = new Map();      // cache berdasarkan menuId atau 'ALL'

    // ------------------------------
    // API HELPER
    async function apiFetch(action, params = {}) {
        const url = new URL(SCRIPT_URL);
        url.searchParams.append("action", action);
        Object.keys(params).forEach(key => {
            if (params[key] !== undefined && params[key] !== null)
                url.searchParams.append(key, params[key]);
        });
        try {
            const response = await fetch(url.toString(), { method: "GET", mode: "cors" });
            const json = await response.json();
            if (json.success === false) throw new Error(json.message || json.error || "Unknown error");
            return json.data;
        } catch (err) {
            console.error("API Error:", err);
            throw new Error(`Gagal mengambil data: ${err.message}`);
        }
    }

    // Ambil menu + bangun tree (simpan flatMap)
    async function loadMenuStructure() {
        try {
            const menuData = await apiFetch("menu");
            // menuData adalah array hasil buildTree (root children)
            fullMenuTree = menuData; 
            // Buat flat mapping: id -> objek (beserta parent_id untuk keperluan)
            flatMenuMap.clear();
            function flatten(items, parentId = "0") {
                for (let item of items) {
                    flatMenuMap.set(item.id, { id: item.id, nama: item.nama, parent_id: parentId, children: item.children });
                    if (item.children && item.children.length) flatten(item.children, item.id);
                }
            }
            flatten(fullMenuTree, "0");
            // Tambahkan root "Semua FAQ" secara virtual untuk menampilkan semua data
            flatMenuMap.set("all", { id: "all", nama: "📋 Semua FAQ", parent_id: "0", isRoot: true });
            renderSidebar(fullMenuTree);
            return true;
        } catch (err) {
            console.error(err);
            document.getElementById("sidebarMenu").innerHTML = `<div style="padding:20px;color:red;">Gagal load menu: ${err.message}</div>`;
            return false;
        }
    }

    // Render sidebar dengan hirarki (recursive)
    function renderSidebar(tree, level = 0) {
        const container = document.getElementById("sidebarMenu");
        if (!container) return;
        if (level === 0) {
            container.innerHTML = "";
            // Tambahkan item "Semua FAQ" di atas
            const allItem = document.createElement("div");
            allItem.className = `nav-item ${currentMenuId === "all" ? "active" : ""}`;
            allItem.setAttribute("data-menu-id", "all");
            allItem.innerHTML = `<div class="nav-icon">🏠</div><span>Semua FAQ</span>`;
            allItem.addEventListener("click", () => selectMenuItem("all", "📋 Semua FAQ"));
            container.appendChild(allItem);
        }
        for (let node of tree) {
            const hasChildren = node.children && node.children.length > 0;
            const menuDiv = document.createElement("div");
            menuDiv.className = `nav-item ${currentMenuId === node.id ? "active" : ""}`;
            menuDiv.setAttribute("data-menu-id", node.id);
            menuDiv.innerHTML = `<div class="nav-icon">📂</div><span>${escapeHtml(node.nama)}</span>`;
            menuDiv.addEventListener("click", (e) => {
                e.stopPropagation();
                selectMenuItem(node.id, node.nama);
            });
            container.appendChild(menuDiv);
            if (hasChildren) {
                const childContainer = document.createElement("div");
                childContainer.style.marginLeft = "28px";
                for (let child of node.children) {
                    const childDiv = document.createElement("div");
                    childDiv.className = `nav-item nav-child ${currentMenuId === child.id ? "active" : ""}`;
                    childDiv.setAttribute("data-menu-id", child.id);
                    childDiv.innerHTML = `<div class="nav-icon">📄</div><span>${escapeHtml(child.nama)}</span>`;
                    childDiv.addEventListener("click", (e) => {
                        e.stopPropagation();
                        selectMenuItem(child.id, child.nama);
                    });
                    childContainer.appendChild(childDiv);
                }
                container.appendChild(childContainer);
            }
        }
        // hilangkan loader jika ada
        const loader = document.getElementById("menuLoader");
        if (loader) loader.remove();
    }

    function selectMenuItem(menuId, menuName) {
        currentMenuId = menuId;
        // update active styles
        document.querySelectorAll(".nav-item").forEach(el => {
            const id = el.getAttribute("data-menu-id");
            if (id === menuId) el.classList.add("active");
            else el.classList.remove("active");
        });
        document.getElementById("dashboardTitle").innerHTML = menuId === "all" ? "Semua FAQ" : `${escapeHtml(menuName)}`;
        document.getElementById("menuDescription").innerHTML = menuId === "all" ? "Menampilkan semua panduan dari semua seller" : `Panduan untuk ${escapeHtml(menuName)}`;
        loadFaqByMenu(menuId);
    }

    // Load FAQ berdasarkan menuId (gunakan cache)
    async function loadFaqByMenu(menuId) {
        const contentDiv = document.getElementById("faqContentArea");
        contentDiv.innerHTML = `<div class="loader"><div class="spinner"></div></div>`;
        try {
            let faqData;
            if (menuId === "all") {
                if (faqCache.has("ALL")) {
                    faqData = faqCache.get("ALL");
                } else {
                    // untuk all, kita bisa fetch dengan cara mengambil semua data FAQ? Karena API tidak mendukung all,
                    // kita akan fetch dari setiap menu? Solusi: fetch semua FAQ dari sheet? API tidak menyediakan endpoint all FAQ, tapi kita bisa mengexploit search dengan string kosong atau menggabungkan.
                    // Lebih baik: ambil data dari action "faq" dengan menuId=null tidak valid, jadi kita panggil menu untuk setiap seller unik?
                    // alternatif: kita punya endpoint search dengan q kosong? tidak ideal. tapi kita bisa mengumpulkan FAQ dari semua menu leaf?
                    // lebih aman: jika menuId === "all", kita kumpulkan semua FAQ dengan cara mengambil semua id menu leaf dan menggabungkan (tanpa duplikat)
                    const allLeafIds = Array.from(flatMenuMap.keys()).filter(id => id !== "all" && flatMenuMap.get(id)?.children?.length === 0);
                    const promises = allLeafIds.map(id => apiFetch("faq", { menuId: id }).catch(() => []));
                    const results = await Promise.all(promises);
                    const combined = results.flat();
                    faqData = combined;
                    faqCache.set("ALL", faqData);
                }
            } else {
                if (faqCache.has(menuId)) {
                    faqData = faqCache.get(menuId);
                } else {
                    faqData = await apiFetch("faq", { menuId: menuId });
                    faqCache.set(menuId, faqData);
                }
            }
            renderFaqList(faqData);
        } catch (err) {
            contentDiv.innerHTML = `<div class="empty-state">❌ Gagal memuat FAQ: ${err.message}<br><button class="reload-btn" style="margin-top:12px;" onclick="location.reload()">Coba lagi</button></div>`;
        }
    }

    function renderFaqList(faqItems) {
        const container = document.getElementById("faqContentArea");
        if (!faqItems || faqItems.length === 0) {
            container.innerHTML = `<div class="empty-state">📭 Belum ada FAQ untuk kategori ini.</div>`;
            return;
        }
        let html = `<div class="faq-container">`;
        faqItems.forEach((item, idx) => {
            const pertanyaan = escapeHtml(item.pertanyaan || "Pertanyaan");
            const jawaban = escapeHtml(item.jawaban || "Tidak ada jawaban").replace(/\n/g, '<br>');
            html += `
                <div class="faq-card" data-idx="${idx}">
                    <div class="faq-question">
                        <span>${pertanyaan}</span>
                        <span class="chevron">▼</span>
                    </div>
                    <div class="faq-answer">
                        <div class="answer-content">${jawaban}</div>
                        <button class="copy-btn" data-answer="${escapeAttr(item.jawaban || "")}">📋 Salin Jawaban</button>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        container.innerHTML = html;

        // attach event listeners: toggle + copy
        document.querySelectorAll('.faq-card').forEach(card => {
            const questionDiv = card.querySelector('.faq-question');
            questionDiv.addEventListener('click', (e) => {
                if (e.target.classList.contains('copy-btn')) return;
                card.classList.toggle('open');
            });
            const copyBtn = card.querySelector('.copy-btn');
            if (copyBtn) {
                copyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const answerText = copyBtn.getAttribute('data-answer') || "";
                    copyToClipboard(answerText);
                });
            }
        });
        // open first card by default?
        if (faqItems.length > 0 && document.querySelector('.faq-card')) {
            // optional: biar user friendly
        }
    }

    // Fungsi pencarian (panggil API search)
    async function performSearch(keyword) {
        if (!keyword || keyword.trim() === "") {
            // jika kosong, kembali ke menu yang aktif saat ini
            if (currentMenuId) loadFaqByMenu(currentMenuId);
            else loadFaqByMenu("all");
            return;
        }
        const contentDiv = document.getElementById("faqContentArea");
        contentDiv.innerHTML = `<div class="loader"><div class="spinner"></div></div>`;
        try {
            const searchResults = await apiFetch("search", { q: keyword });
            document.getElementById("dashboardTitle").innerHTML = `🔍 Hasil pencarian: "${escapeHtml(keyword)}"`;
            document.getElementById("menuDescription").innerHTML = `${searchResults.length} FAQ ditemukan`;
            renderFaqList(searchResults);
            // set active menu hilang highlight
            document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
            currentMenuId = null;
        } catch (err) {
            contentDiv.innerHTML = `<div class="empty-state">⚠️ Pencarian gagal: ${err.message}</div>`;
        }
    }

    // reload data (bersihkan cache, reload menu + paksa reset ke "all")
    async function reloadAllData() {
        showToast("Memperbarui data...", 1500);
        faqCache.clear();
        try {
            await loadMenuStructure();
            // reset ke menu all
            currentMenuId = "all";
            await loadFaqByMenu("all");
            document.getElementById("dashboardTitle").innerHTML = "Semua FAQ";
            document.getElementById("menuDescription").innerHTML = "Data telah dimuat ulang";
            const activeAll = document.querySelector(`.nav-item[data-menu-id="all"]`);
            if (activeAll) {
                document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
                activeAll.classList.add("active");
            }
            showToast("✅ Data berhasil dimuat ulang");
        } catch (err) {
            showToast("Gagal reload data: " + err.message, 3000);
        }
    }

    // copy helper
    function copyToClipboard(text) {
        if (!text) {
            showToast("⚠️ Tidak ada jawaban untuk disalin", 1500);
            return;
        }
        navigator.clipboard.writeText(text).then(() => {
            showToast("📋 Jawaban tersalin ke clipboard!");
        }).catch(() => {
            showToast("Gagal menyalin", 1500);
        });
    }

    function showToast(msg, duration = 2000) {
        const toast = document.getElementById("toastMsg");
        toast.textContent = msg;
        toast.style.opacity = "1";
        setTimeout(() => {
            toast.style.opacity = "0";
        }, duration);
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    function escapeAttr(str) {
        if (!str) return "";
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Dark mode toggle
    function initDarkMode() {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const saved = localStorage.getItem('darkMode');
        if (saved === 'enabled' || (saved === null && prefersDark)) {
            document.body.classList.add('dark');
        } else {
            document.body.classList.remove('dark');
        }
        const toggleBtn = document.getElementById("themeToggleBtn");
        toggleBtn.addEventListener("click", () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
            toggleBtn.innerHTML = isDark ? "☀️ <span>Mode Terang</span>" : "🌙 <span>Mode Gelap</span>";
        });
        toggleBtn.innerHTML = document.body.classList.contains('dark') ? "☀️ <span>Mode Terang</span>" : "🌙 <span>Mode Gelap</span>";
    }

    // Event binding & initial load
    async function bootstrap() {
        initDarkMode();
        // load menu dan data
        await loadMenuStructure();
        // pilih menu default: "Semua FAQ"
        await selectMenuItem("all", "Semua FAQ");
        // search binding
        const searchBtn = document.getElementById("searchBtn");
        const searchInput = document.getElementById("searchInput");
        searchBtn.addEventListener("click", () => {
            const kw = searchInput.value.trim();
            performSearch(kw);
        });
        searchInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") performSearch(searchInput.value.trim());
        });
        const reloadBtn = document.getElementById("reloadDataBtn");
        reloadBtn.addEventListener("click", () => reloadAllData());
    }

    bootstrap().catch(err => {
        document.getElementById("faqContentArea").innerHTML = `<div class="empty-state">🔥 Error koneksi: ${err.message}<br>Pastikan Web App sudah dipublish & CORS aman.</div>`;
    });
</script>
</body>
</html>
