<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Pusat Bantuan · Seller Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.1s ease;
        }

        :root {
            --tg-bg: #ffffff;
            --tg-surface: #f0f2f5;
            --tg-header-bg: #ffffff;
            --tg-primary: #3390ec;
            --tg-primary-dark: #2a7bcb;
            --tg-text: #000000;
            --tg-text-secondary: #5e6672;
            --tg-border: #e7e9ec;
            --tg-shadow: rgba(0, 0, 0, 0.05);
            --tg-card: #ffffff;
            --tg-icon-fill: #8e8e93;
            --tg-sidebar-hover: #f4f4f5;
            --faq-border: #eff0f2;
            --code-bg: #f9f9fb;
        }

        body.dark {
            --tg-bg: #0f0f12;
            --tg-surface: #1c1c1e;
            --tg-header-bg: #1c1c1e;
            --tg-primary: #53a9ff;
            --tg-primary-dark: #3e8be0;
            --tg-text: #ffffff;
            --tg-text-secondary: #aaaab3;
            --tg-border: #2c2c30;
            --tg-shadow: rgba(0, 0, 0, 0.3);
            --tg-card: #252528;
            --tg-icon-fill: #8e8e93;
            --tg-sidebar-hover: #2c2c30;
            --faq-border: #2e2e32;
            --code-bg: #1e1e22;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--tg-bg);
            color: var(--tg-text);
            height: 100vh;
            overflow: hidden;
        }

        /* Layout utama mirip Telegram desktop + mobile */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* SIDEBAR (daftar menu tree seller & anak) */
        .sidebar {
            width: 280px;
            background: var(--tg-surface);
            border-right: 1px solid var(--tg-border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
            transition: transform 0.25s ease;
        }

        .sidebar-header {
            padding: 20px 16px 12px;
            border-bottom: 1px solid var(--tg-border);
            background: inherit;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .logo-icon {
            background: var(--tg-primary);
            width: 32px;
            height: 32px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.25rem;
        }

        .reload-btn {
            background: var(--tg-card);
            border: 1px solid var(--tg-border);
            border-radius: 40px;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--tg-text);
            width: 100%;
            justify-content: center;
            transition: 0.1s;
        }

        .reload-btn:hover {
            background: var(--tg-sidebar-hover);
        }

        .nav-tree {
            flex: 1;
            padding: 12px 8px 20px;
        }

        .tree-item {
            list-style: none;
            margin-bottom: 4px;
        }

        .tree-node {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--tg-text);
            transition: 0.1s;
        }

        .tree-node-content {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .tree-node-icon {
            width: 28px;
            font-size: 1.2rem;
        }

        .tree-node-title {
            flex: 1;
        }

        .tree-node.active {
            background: var(--tg-primary);
            color: white;
        }

        .tree-node:not(.active):hover {
            background: var(--tg-sidebar-hover);
        }

        .children-list {
            padding-left: 32px;
            margin-top: 4px;
        }

        /* main content area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--tg-bg);
        }

        /* header atas (mode toggle + judul) */
        .main-header {
            padding: 16px 24px;
            background: var(--tg-header-bg);
            border-bottom: 1px solid var(--tg-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .page-title h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .page-title p {
            font-size: 0.8rem;
            color: var(--tg-text-secondary);
            margin-top: 4px;
        }

        .theme-toggle {
            background: var(--tg-surface);
            border: 1px solid var(--tg-border);
            border-radius: 40px;
            padding: 6px 12px;
            display: flex;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        /* search bar */
        .search-section {
            padding: 16px 24px 8px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--tg-surface);
            border-radius: 44px;
            padding: 8px 18px;
            border: 1px solid var(--tg-border);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1rem;
            padding: 8px 0;
            color: var(--tg-text);
        }

        .search-box button {
            background: var(--tg-primary);
            border: none;
            border-radius: 30px;
            padding: 6px 18px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        /* FAQ list container */
        .faq-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px 30px;
        }

        .faq-card {
            background: var(--tg-card);
            border-radius: 20px;
            margin-bottom: 18px;
            border: 1px solid var(--tg-border);
            overflow: hidden;
            transition: 0.1s;
        }

        .faq-question {
            padding: 18px 20px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid transparent;
            background: var(--tg-card);
        }

        .faq-question:hover {
            background: var(--tg-sidebar-hover);
        }

        .question-text {
            flex: 1;
            padding-right: 12px;
        }

        .copy-badge {
            background: var(--tg-surface);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--tg-text-secondary);
            cursor: pointer;
            transition: 0.1s;
        }

        .copy-badge:hover {
            background: var(--tg-primary);
            color: white;
        }

        .faq-answer {
            padding: 0 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease-out;
            background: var(--tg-card);
            border-top: 1px solid transparent;
        }

        .faq-answer.open {
            max-height: 800px;
            padding: 18px 20px;
            border-top: 1px solid var(--tg-border);
        }

        .answer-content {
            line-height: 1.5;
            white-space: pre-wrap;
            background: var(--code-bg);
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--tg-text-secondary);
        }

        /* scroll */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--tg-border);
            border-radius: 10px;
        }

        @media (max-width: 680px) {
            .sidebar {
                position: fixed;
                z-index: 20;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                width: 280px;
                box-shadow: 2px 0 12px var(--tg-shadow);
            }
            .sidebar.mobile-open {
                transform: translateX(0);
            }
            .main-header .menu-mobile-btn {
                display: block;
                margin-right: 12px;
                background: var(--tg-surface);
                border: none;
                border-radius: 30px;
                padding: 6px 12px;
                font-size: 20px;
                cursor: pointer;
            }
            .main-content {
                width: 100%;
            }
            .faq-container, .search-section {
                padding: 12px 16px;
            }
        }

        .menu-mobile-btn {
            display: none;
            background: var(--tg-surface);
            border: none;
            font-size: 24px;
            cursor: pointer;
            border-radius: 30px;
            width: 40px;
            height: 40px;
        }

        .overlay-mobile {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 15;
        }

        @media (max-width: 680px) {
            .menu-mobile-btn {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .overlay-mobile.active {
                display: block;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-area">
                <div class="logo-icon">📘</div>
                <div class="logo-text">HelpDesk Seller</div>
            </div>
            <button class="reload-btn" id="reloadDataBtn">⟳ Muat ulang data</button>
        </div>
        <div class="nav-tree" id="menuTreeContainer">
            <!-- menu tree dinamis -->
            <div style="padding: 20px; text-align:center">Memuat menu...</div>
        </div>
    </div>
    <div class="main-content">
        <div class="main-header">
            <div style="display: flex; align-items: center; gap: 8px;">
                <button class="menu-mobile-btn" id="mobileMenuBtn">☰</button>
                <div class="page-title">
                    <h2 id="currentMenuTitle">Semua FAQ</h2>
                    <p id="currentMenuSub">Pilih kategori dari menu samping</p>
                </div>
            </div>
            <div class="theme-toggle" id="themeToggle">
                🌞 / 🌙 Mode
            </div>
        </div>
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari pertanyaan atau jawaban..." autocomplete="off">
                <button id="searchBtn">Cari</button>
            </div>
        </div>
        <div class="faq-container" id="faqListContainer">
            <div class="empty-state">✨ Silakan pilih menu atau cari topik</div>
        </div>
    </div>
    <div class="overlay-mobile" id="overlayMobile"></div>
</div>

<script>
    // Konfigurasi API endpoint
    const API_BASE = "https://script.google.com/macros/s/AKfycbwKJUJieEWG91Bu_FQsgJxV4FSvUTJCFbbByfuTh0FQk12eRk2WqZH4wLLiqYsXWMPL/exec";

    // State global
    let menuTree = [];            // tree menu hasil build
    let flatFaqs = [];           // semua faq dari sheet
    let currentMenuId = "0";     // default root menunjukkan semua? tapi kita pilih menu tertentu? awalnya tampilkan semua root? tapi lebih baik tampilkan root "Semua"
    let isLoading = false;
    let currentMode = "light";    // light / dark
    
    // DOM elements
    const menuContainer = document.getElementById("menuTreeContainer");
    const faqContainer = document.getElementById("faqListContainer");
    const currentMenuTitleSpan = document.getElementById("currentMenuTitle");
    const currentMenuSubSpan = document.getElementById("currentMenuSub");
    const reloadBtn = document.getElementById("reloadDataBtn");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const themeToggle = document.getElementById("themeToggle");
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlayMobile");
    
    // Helper: fetch JSON dengan parameter
    async function fetchAPI(action, params = {}) {
        const url = new URL(API_BASE);
        url.searchParams.append("action", action);
        Object.keys(params).forEach(k => {
            if (params[k] !== undefined && params[k] !== null)
                url.searchParams.append(k, params[k]);
        });
        const resp = await fetch(url.toString());
        const json = await resp.json();
        if (!json.success) throw new Error(json.message || json.error || "Gagal ambil data");
        return json.data;
    }
    
    // Load semua data: menu & semua faq (untuk keperluan filtering by menu + search)
    async function loadAllData() {
        if (isLoading) return;
        isLoading = true;
        try {
            // 1. Ambil menu tree
            const treeData = await fetchAPI("menu");
            menuTree = treeData;
            // 2. Ambil semua FAQ (tanpa filter menu id) dengan memanggil ?action=faq tanpa menuId?? tidak ada endpoint all, tapi kita bisa pakai action=faq dengan menuId=0 atau? berdasarkan kode di apps script: action faq butuh menuId, kalau tidak dikirim error.
            // Solusi: Agar semua FAQ bisa di-cache, kita panggil search dengan keyword kosong (action=search & q=) akan mengembalikan semua rows.
            const allFaqs = await fetchAPI("search", { q: "" });
            flatFaqs = allFaqs;
            // Render menu tree di sidebar
            renderMenuTree(menuTree);
            // Jika sebelumnya ada menu yang aktif, pertahankan, jika belum maka set default ke root (tampilkan semua FAQ)
            if (!currentMenuId || currentMenuId === "0") {
                currentMenuId = "0";
                displayFaqsByMenuOrSearch(null);
            } else {
                // pastikan menuId masih valid, jika tidak reset
                const exists = checkMenuExists(menuTree, currentMenuId);
                if (!exists) currentMenuId = "0";
                displayFaqsByMenuOrSearch(null);
            }
        } catch (err) {
            console.error(err);
            faqContainer.innerHTML = `<div class="empty-state">❌ Gagal memuat: ${err.message}<br>Tekan tombol reload.</div>`;
        } finally {
            isLoading = false;
        }
    }
    
    function checkMenuExists(tree, id) {
        for (const node of tree) {
            if (node.id === id) return true;
            if (node.children && checkMenuExists(node.children, id)) return true;
        }
        return false;
    }
    
    // render tree menu dengan indentasi
    function renderMenuTree(tree) {
        if (!tree || tree.length === 0) {
            menuContainer.innerHTML = `<div style="padding:12px">Tidak ada menu</div>`;
            return;
        }
        const buildTreeUL = (nodes, level = 0) => {
            let html = '';
            for (const node of nodes) {
                const isActive = (currentMenuId === node.id);
                const activeClass = isActive ? 'active' : '';
                html += `<li class="tree-item">
                            <div class="tree-node ${activeClass}" data-id="${node.id}" data-name="${escapeHtml(node.nama)}">
                                <div class="tree-node-content">
                                    <span class="tree-node-icon">${level === 0 ? '📁' : '📄'}</span>
                                    <span class="tree-node-title">${escapeHtml(node.nama)}</span>
                                </div>
                            </div>`;
                if (node.children && node.children.length > 0) {
                    html += `<ul class="children-list">${buildTreeUL(node.children, level + 1)}</ul>`;
                }
                html += `</li>`;
            }
            return html;
        };
        const ulHtml = `<ul style="list-style:none; margin:0; padding:0;">${buildTreeUL(tree)}</ul>`;
        menuContainer.innerHTML = ulHtml;
        // attach click listeners untuk setiap .tree-node
        document.querySelectorAll('.tree-node').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = el.getAttribute('data-id');
                const name = el.getAttribute('data-name');
                if (id) {
                    setActiveMenu(id, name);
                    // tutup sidebar di mobile setelah klik
                    if (window.innerWidth <= 680) {
                        sidebar.classList.remove('mobile-open');
                        overlay.classList.remove('active');
                    }
                }
            });
        });
    }
    
    function setActiveMenu(menuId, menuName) {
        currentMenuId = menuId;
        // update tampilan active di tree
        document.querySelectorAll('.tree-node').forEach(node => {
            node.classList.remove('active');
            if (node.getAttribute('data-id') === menuId) node.classList.add('active');
        });
        currentMenuTitleSpan.innerText = menuName || (menuId === "0" ? "Semua FAQ" : "FAQ");
        currentMenuSubSpan.innerText = menuId === "0" ? "Semua pertanyaan dari semua seller" : `Menampilkan FAQ untuk ${menuName || 'kategori'}`;
        // reset search input biar konsisten
        if (searchInput.value.trim() !== "") {
            searchInput.value = "";
        }
        displayFaqsByMenuOrSearch(null);
    }
    
    // menampilkan FAQ berdasarkan currentMenuId atau hasil pencarian (jika keyword diisi)
    function displayFaqsByMenuOrSearch(keywordOverride = null) {
        let filtered = [...flatFaqs];
        const keyword = (keywordOverride !== null) ? keywordOverride : (searchInput.value.trim().toLowerCase());
        if (keyword && keyword !== "") {
            filtered = flatFaqs.filter(f => {
                const q = (f.pertanyaan || "").toLowerCase();
                const a = (f.jawaban || "").toLowerCase();
                return q.includes(keyword) || a.includes(keyword);
            });
            currentMenuTitleSpan.innerText = `Hasil: "${keyword}"`;
            currentMenuSubSpan.innerText = `${filtered.length} FAQ ditemukan`;
            // nonaktifkan highlight menu aktif sementara
        } else {
            // filter by menuId
            if (currentMenuId && currentMenuId !== "0") {
                filtered = flatFaqs.filter(f => String(f.menu_id) === String(currentMenuId));
            }
            // sudah di set title sebelumnya dari setActiveMenu
        }
        renderFaqCards(filtered);
    }
    
    function renderFaqCards(faqsList) {
        if (!faqsList.length) {
            faqContainer.innerHTML = `<div class="empty-state">📭 Belum ada FAQ untuk kategori ini.<br>Coba kata kunci lain atau pilih menu.</div>`;
            return;
        }
        let html = '';
        faqsList.forEach((faq, idx) => {
            const safeId = `faq-${idx}-${faq.id}`;
            const pertanyaan = escapeHtml(faq.pertanyaan || "Pertanyaan tidak tersedia");
            const jawaban = escapeHtml(faq.jawaban || "Jawaban belum diisi.");
            html += `
                <div class="faq-card" data-faq-id="${faq.id}">
                    <div class="faq-question" data-target="${safeId}">
                        <span class="question-text">${pertanyaan}</span>
                        <span class="copy-badge" data-copy-answer="${faq.id}">📋 Salin jawaban</span>
                    </div>
                    <div class="faq-answer" id="${safeId}">
                        <div class="answer-content">${jawaban.replace(/\n/g, '<br>')}</div>
                    </div>
                </div>
            `;
        });
        faqContainer.innerHTML = html;
        // attach event untuk toggle answer dan copy
        document.querySelectorAll('.faq-question').forEach(header => {
            const targetId = header.getAttribute('data-target');
            const answerDiv = document.getElementById(targetId);
            const copyBtn = header.querySelector('.copy-badge');
            if (copyBtn) {
                copyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const faqId = copyBtn.getAttribute('data-copy-answer');
                    const faqItem = flatFaqs.find(f => String(f.id) === String(faqId));
                    if (faqItem && faqItem.jawaban) {
                        navigator.clipboard.writeText(faqItem.jawaban).then(() => {
                            const originalText = copyBtn.innerText;
                            copyBtn.innerText = "✅ Disalin!";
                            setTimeout(() => copyBtn.innerText = originalText, 1200);
                        }).catch(() => alert("Gagal menyalin"));
                    } else {
                        alert("Jawaban tidak tersedia");
                    }
                    e.preventDefault();
                });
            }
            header.addEventListener('click', (e) => {
                if (e.target.classList && e.target.classList.contains('copy-badge')) return;
                if (answerDiv) {
                    answerDiv.classList.toggle('open');
                }
            });
        });
    }
    
    // fungsi search submit
    function performSearch() {
        const keyword = searchInput.value.trim();
        if (keyword === "") {
            // kembali ke menu aktif
            if (currentMenuId && currentMenuId !== "0") {
                const nodeTitle = getMenuNameById(menuTree, currentMenuId);
                setActiveMenu(currentMenuId, nodeTitle);
            } else {
                setActiveMenu("0", "Semua FAQ");
            }
        } else {
            displayFaqsByMenuOrSearch(keyword);
        }
    }
    
    function getMenuNameById(tree, id) {
        for (const node of tree) {
            if (node.id === id) return node.nama;
            if (node.children) {
                const found = getMenuNameById(node.children, id);
                if (found) return found;
            }
        }
        return "Kategori";
    }
    
    // Reload semua data dari server
    async function manualRefresh() {
        if (isLoading) return;
        faqContainer.innerHTML = `<div class="empty-state">🔄 Memperbarui data dari database...</div>`;
        try {
            await loadAllData();
        } catch(e) {
            faqContainer.innerHTML = `<div class="empty-state">⛔ Gagal refresh. Cek koneksi atau CORS.</div>`;
        }
    }
    
    // Theme dark/light
    function initTheme() {
        const saved = localStorage.getItem('sellerTheme');
        if (saved === 'dark') {
            document.body.classList.add('dark');
            currentMode = 'dark';
        } else {
            document.body.classList.remove('dark');
            currentMode = 'light';
        }
    }
    function toggleTheme() {
        if (currentMode === 'light') {
            document.body.classList.add('dark');
            currentMode = 'dark';
            localStorage.setItem('sellerTheme', 'dark');
        } else {
            document.body.classList.remove('dark');
            currentMode = 'light';
            localStorage.setItem('sellerTheme', 'light');
        }
    }
    
    // Mobile handlers
    function toggleMobileMenu() {
        sidebar.classList.toggle('mobile-open');
        overlay.classList.toggle('active');
    }
    function closeMobileMenu() {
        sidebar.classList.remove('mobile-open');
        overlay.classList.remove('active');
    }
    
    // escape html
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // event listeners
    reloadBtn.addEventListener('click', manualRefresh);
    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });
    themeToggle.addEventListener('click', toggleTheme);
    mobileMenuBtn.addEventListener('click', toggleMobileMenu);
    overlay.addEventListener('click', closeMobileMenu);
    window.addEventListener('resize', () => {
        if (window.innerWidth > 680) {
            sidebar.classList.remove('mobile-open');
            overlay.classList.remove('active');
        }
    });
    
    // initial load
    initTheme();
    loadAllData().catch(e => {
        console.warn(e);
        faqContainer.innerHTML = `<div class="empty-state">⚠️ Gagal memuat data awal. Periksa endpoint atau koneksi.<br>${e.message}</div>`;
    });
    
    // ekspos fungsi tambahan: set active default (Semua) dengan id '0' namun kita punya menu root? Menambahkan menu "Semua" di tree?
    // tapi karena tidak di tree, kita buat secara virtual fitur default menampilkan semua saat load dan bisa pilih menu root. 
    // tambahkan manual untuk memastikan menu root pilihan? saat load selesai dan jika menu belum dipilih, set menu 0 "Semua FAQ"
    // setelah load data selesai, kita set default menu 0 dengan nama "Semua FAQ"
    // kita override sedikit di akhir loadAllData untuk pastikan ada pilihan awal.
    // kita panggil setActiveMenu jika currentMenuId "0" 
    window.addEventListener('load', () => {
        // sedikit delay memastikan tree sudah render
        setTimeout(() => {
            if (!currentMenuId || currentMenuId === "0") {
                // jika tidak ada menu aktif panggil setActiveMenu dengan dummy title
                const allMenuNode = document.querySelector('.tree-node[data-id="0"]');
                if (!allMenuNode) {
                    // kita buat virtual, tapi user bisa klik root? root tidak ada, karena menu tree tidak punya id 0. Tapi kita tetap bisa menampilkan semua FAQ.
                    currentMenuTitleSpan.innerText = "Semua FAQ";
                    currentMenuSubSpan.innerText = "Semua pertanyaan dari semua seller";
                    displayFaqsByMenuOrSearch(null);
                } else {
                    setActiveMenu("0", "Semua FAQ");
                }
            }
        }, 100);
    });
    
    // fix handle ketika pertama kali menuTree mungkin tidak memiliki node id 0, override gaya.
    // menambahkan fitur untuk "semua kategori" secara visual?
    // tapi tidak apa-apa, user bisa klik pada menu seller1/seller2.
    // kita tambahkan tombol "Semua FAQ" secara dinamis di header sidebar? tidak perlu, cukup lewat judul.
    // saat load, kita set tampilan all FAQ.
    // update akhir: setelah render menu, tambahkan item khusus "🏠 Semua FAQ" di bagian atas daftar untuk kemudahan.
    function addAllFaqMenuItem() {
        const container = menuContainer.querySelector('ul');
        if (container && !document.getElementById('virtual-all-faq')) {
            const allItem = document.createElement('li');
            allItem.className = 'tree-item';
            allItem.id = 'virtual-all-faq';
            allItem.innerHTML = `<div class="tree-node ${currentMenuId === '0' ? 'active' : ''}" data-id="0" data-name="🏠 Semua FAQ">
                                    <div class="tree-node-content">
                                        <span class="tree-node-icon">🏠</span>
                                        <span class="tree-node-title">Semua FAQ</span>
                                    </div>
                                </div>`;
            container.prepend(allItem);
            const nodeDiv = allItem.querySelector('.tree-node');
            nodeDiv.addEventListener('click', (e) => {
                setActiveMenu("0", "Semua FAQ");
                closeMobileMenu();
            });
        }
    }
    
    // observer untuk menambahkan menu semua setelah render
    const observer = new MutationObserver(() => {
        if (menuContainer.querySelector('ul')) {
            addAllFaqMenuItem();
            observer.disconnect();
        }
    });
    observer.observe(menuContainer, { childList: true, subtree: true });
</script>
</body>
</html>
