<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Minipack</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #ffffff; --surface: #f0f2f5; --primary: #3390ec; --text: #000000; --text-secondary: #5e6672; --border: #e7e9ec; --card: #ffffff; }
        body.dark { --bg: #0f0f12; --surface: #1c1c1e; --primary: #53a9ff; --text: #ffffff; --text-secondary: #aaaab3; --border: #2c2c30; --card: #252528; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        .app { display: flex; height: 100vh; width: 100%; }
        .sidebar { width: 300px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; transition: transform 0.25s ease; }
        .sidebar-header { padding: 20px 16px; border-bottom: 1px solid var(--border); }
        .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .logo-icon { background: var(--primary); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .logo-text { font-weight: 700; font-size: 1.2rem; }
        .reload-btn { background: var(--card); border: 1px solid var(--border); border-radius: 40px; padding: 10px; width: 100%; cursor: pointer; font-weight: 500; color: var(--text); }
        .nav-tree { padding: 12px 8px; }
        .tree-item { list-style: none; margin-bottom: 2px; }
        .tree-node { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px; cursor: pointer; font-size: 0.9rem; }
        .tree-node-content { display: flex; align-items: center; gap: 10px; flex: 1; }
        .tree-node:hover { background: var(--surface); background: #e8e8ed; }
        body.dark .tree-node:hover { background: #2c2c30; }
        .tree-node.active { background: var(--primary); color: white; }
        .collapse-icon { width: 24px; text-align: center; cursor: pointer; font-size: 12px; }
        .children-list { padding-left: 28px; }
        .children-list.collapsed { display: none; }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .main-header { padding: 16px 24px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .title-area h2 { font-size: 1.3rem; }
        .title-area p { font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; }
        .theme-toggle, .mobile-menu-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 30px; padding: 8px 16px; cursor: pointer; font-weight: 500; }
        .mobile-menu-btn { display: none; }
        .search-section { padding: 16px 24px 8px; }
        .search-box { display: flex; gap: 10px; background: var(--surface); border-radius: 44px; padding: 6px 18px; border: 1px solid var(--border); }
        .search-box input { flex: 1; background: transparent; border: none; outline: none; font-size: 0.95rem; padding: 10px 0; color: var(--text); }
        .search-box button { background: var(--primary); border: none; border-radius: 30px; padding: 6px 20px; color: white; font-weight: 600; cursor: pointer; }
        .faq-container { flex: 1; overflow-y: auto; padding: 16px 24px 30px; }
        .faq-card { background: var(--card); border-radius: 16px; margin-bottom: 16px; border: 1px solid var(--border); overflow: hidden; }
        .faq-question { padding: 16px 20px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .faq-question:hover { background: var(--surface); }
        .copy-all-btn { background: var(--surface); padding: 6px 14px; border-radius: 40px; font-size: 0.7rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
        .copy-all-btn:hover { background: var(--primary); color: white; }
        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.25s ease-out; background: var(--surface); border-top: 1px solid transparent; }
        .faq-answer.open { max-height: 800px; padding: 18px 20px; border-top: 1px solid var(--border); }
        .answer-item { margin-bottom: 12px; padding: 8px 12px; background: var(--bg); border-radius: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .answer-text { flex: 1; line-height: 1.5; }
        .copy-single-btn { background: var(--surface); padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; cursor: pointer; }
        .copy-single-btn:hover { background: var(--primary); color: white; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        @media (max-width: 680px) {
            .sidebar { position: fixed; z-index: 100; transform: translateX(-100%); width: 280px; height: 100%; }
            .sidebar.open { transform: translateX(0); }
            .mobile-menu-btn { display: block; }
            .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 90; }
            .overlay.open { display: block; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo"><div class="logo-icon">📘</div><div class="logo-text">Pusat Bantuan</div></div>
            <button class="reload-btn" id="reloadBtn">⟳ Refresh Data</button>
        </div>
        <div class="nav-tree" id="menuTree"></div>
    </div>
    <div class="main">
        <div class="main-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                <div class="title-area">
                    <h2 id="pageTitle">Pusat Bantuan</h2>
                    <p id="pageSub">Pilih kategori dari menu samping</p>
                </div>
            </div>
            <button class="theme-toggle" id="themeToggle">🌓 Mode Gelap/Terang</button>
        </div>
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari pertanyaan atau jawaban...">
                <button id="searchBtn">Cari</button>
            </div>
        </div>
        <div class="faq-container" id="faqContainer">
            <div class="empty-state">✨ Pilih kategori dari menu samping</div>
        </div>
    </div>
    <div class="overlay" id="overlay"></div>
</div>

<script>
    // 🔴 GANTI URL INI DENGAN APPS SCRIPT ANDA 🔴
    const API = "https://script.google.com/macros/s/AKfycbwl6tl5pNVLOQoWG_xYSHrV4YPIy2KneMarKApGIFiUY5ZMEb6GWK6tX_99aArvFPD1/exec";
    
    let menuTree = [];
    let allFaqs = [];
    let currentMenuId = "0";
    let currentMenuName = "Semua FAQ";

    async function fetchAPI(action, params = {}) {
        const url = new URL(API);
        url.searchParams.append("action", action);
        Object.keys(params).forEach(k => {
            if (params[k] !== undefined && params[k] !== "") {
                url.searchParams.append(k, params[k]);
            }
        });
        
        const resp = await fetch(url.toString());
        const json = await resp.json();
        if (!json.success) throw new Error(json.message || "Gagal ambil data");
        return json.data;
    }

    async function loadAll() {
        try {
            menuTree = await fetchAPI("menu");
            allFaqs = await fetchAPI("search", { q: "" });
            renderMenuTree(menuTree);
            renderFaqs();
        } catch (err) {
            document.getElementById("faqContainer").innerHTML = `<div class="empty-state">❌ Gagal memuat data: ${err.message}</div>`;
        }
    }

    function renderMenuTree(tree) {
        const container = document.getElementById("menuTree");
        
        const buildTreeHTML = (nodes, level = 0) => {
            let html = '<ul style="list-style:none; padding-left: 0;">';
            for (const node of nodes) {
                const hasChildren = node.children && node.children.length > 0;
                const isActive = currentMenuId === node.id;
                const nodeName = node.nama || '(tanpa nama)';
                
                html += `<li class="tree-item">
                    <div class="tree-node ${isActive ? 'active' : ''}" data-id="${node.id}" data-name="${escapeHtml(nodeName)}">
                        <div class="tree-node-content">
                            <span>${level === 0 ? '📁' : '📄'}</span>
                            <span>${escapeHtml(nodeName)}</span>
                        </div>`;
                
                if (hasChildren) {
                    html += `<span class="collapse-icon" data-id="${node.id}">▼</span>`;
                }
                
                html += `</div>`;
                
                if (hasChildren) {
                    html += `<div class="children-list" id="children-${node.id}">${buildTreeHTML(node.children, level + 1)}</div>`;
                }
                
                html += `</li>`;
            }
            html += `</ul>`;
            return html;
        };
        
        container.innerHTML = buildTreeHTML(tree);
        
        // Event klik menu
        document.querySelectorAll('.tree-node').forEach(el => {
            const id = el.getAttribute('data-id');
            const name = el.getAttribute('data-name');
            el.addEventListener('click', (e) => {
                if (e.target.classList.contains('collapse-icon')) return;
                setActiveMenu(id, name);
                if (window.innerWidth <= 680) closeSidebar();
            });
        });
        
        // Event collapse/expand
        document.querySelectorAll('.collapse-icon').forEach(icon => {
            icon.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = icon.closest('.tree-node').getAttribute('data-id');
                const childList = document.getElementById(`children-${id}`);
                if (childList) {
                    childList.classList.toggle('collapsed');
                    icon.textContent = childList.classList.contains('collapsed') ? '▶' : '▼';
                }
            });
        });
    }

    function setActiveMenu(id, name) {
        currentMenuId = id;
        currentMenuName = name || "Semua FAQ";
        document.getElementById("pageTitle").innerText = name || "Semua FAQ";
        document.getElementById("pageSub").innerText = id === "0" ? "Semua pertanyaan dari semua kategori" : `Menampilkan FAQ untuk ${name || 'kategori ini'}`;
        
        document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('active'));
        const activeNode = document.querySelector(`.tree-node[data-id="${id}"]`);
        if (activeNode) activeNode.classList.add('active');
        
        document.getElementById("searchInput").value = "";
        renderFaqs();
    }

    function renderFaqs() {
        let filtered = [...allFaqs];
        const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
        
        if (keyword) {
            filtered = allFaqs.filter(f => 
                (f.pertanyaan || "").toLowerCase().includes(keyword) || 
                (f.jawaban || "").toLowerCase().includes(keyword)
            );
            document.getElementById("pageTitle").innerText = `Hasil: "${keyword}"`;
            document.getElementById("pageSub").innerText = `${filtered.length} FAQ ditemukan`;
        } else if (currentMenuId !== "0") {
            filtered = allFaqs.filter(f => String(f.menu_id) === String(currentMenuId));
        }
        
        const container = document.getElementById("faqContainer");
        
        if (!filtered.length) {
            container.innerHTML = `<div class="empty-state">📭 Tidak ada FAQ untuk kategori ini</div>`;
            return;
        }
        
        let html = '';
        filtered.forEach((faq, idx) => {
            const answerId = `ans-${idx}`;
            const jawabanList = faq.jawaban_list || [];
            let jawabanHtml = '';
            
            if (jawabanList.length) {
                jawabanList.forEach((j, i) => {
                    jawabanHtml += `<div class="answer-item">
                        <span class="answer-text">${i+1}. ${escapeHtml(j)}</span>
                        <span class="copy-single-btn" data-copy="${escapeHtml(j)}">📋 Salin</span>
                    </div>`;
                });
            } else {
                jawabanHtml = `<div class="answer-item">
                    <span class="answer-text">${escapeHtml(faq.jawaban || "Jawaban belum tersedia")}</span>
                    <span class="copy-single-btn" data-copy="${escapeHtml(faq.jawaban || "")}">📋 Salin</span>
                </div>`;
            }
            
            html += `<div class="faq-card">
                <div class="faq-question" data-target="${answerId}">
                    <span>❓ ${escapeHtml(faq.pertanyaan)}</span>
                    <span class="copy-all-btn" data-copy-all='${JSON.stringify(jawabanList.length ? jawabanList : [faq.jawaban])}'>📋 Salin Semua</span>
                </div>
                <div class="faq-answer" id="${answerId}">
                    ${jawabanHtml}
                </div>
            </div>`;
        });
        
        container.innerHTML = html;
        
        // Event toggle jawaban
        document.querySelectorAll('.faq-question').forEach(q => {
            const targetId = q.getAttribute('data-target');
            const answerDiv = document.getElementById(targetId);
            
            q.addEventListener('click', (e) => {
                if (e.target.classList.contains('copy-all-btn') || e.target.classList.contains('copy-single-btn')) return;
                answerDiv.classList.toggle('open');
            });
            
            // Tombol salin semua
            const copyAllBtn = q.querySelector('.copy-all-btn');
            if (copyAllBtn) {
                copyAllBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    let data;
                    try {
                        data = JSON.parse(copyAllBtn.getAttribute('data-copy-all'));
                    } catch {
                        data = [copyAllBtn.getAttribute('data-copy-all')];
                    }
                    const text = Array.isArray(data) ? data.map((j, i) => `${i+1}. ${j}`).join('\n') : data;
                    navigator.clipboard.writeText(text);
                    const originalText = copyAllBtn.innerHTML;
                    copyAllBtn.innerHTML = '✅ Tersalin!';
                    setTimeout(() => copyAllBtn.innerHTML = originalText, 1500);
                });
            }
        });
        
        // Tombol salin per jawaban
        document.querySelectorAll('.copy-single-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const text = btn.getAttribute('data-copy');
                navigator.clipboard.writeText(text);
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅';
                setTimeout(() => btn.innerHTML = originalText, 1000);
            });
        });
    }

    function searchFaq() {
        const keyword = document.getElementById("searchInput").value.trim();
        if (keyword) {
            currentMenuId = "0";
            currentMenuName = "Hasil Pencarian";
            document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('active'));
            renderFaqs();
        } else {
            setActiveMenu(currentMenuId, currentMenuName);
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }

    // Theme toggle
    const themeToggle = document.getElementById("themeToggle");
    themeToggle.onclick = () => {
        document.body.classList.toggle("dark");
        localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    };
    if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark");

    // Mobile sidebar
    const mobileBtn = document.getElementById("mobileMenuBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    
    function openSidebar() {
        sidebar.classList.add("open");
        overlay.classList.add("open");
    }
    function closeSidebar() {
        sidebar.classList.remove("open");
        overlay.classList.remove("open");
    }
    
    mobileBtn.onclick = openSidebar;
    overlay.onclick = closeSidebar;

    // Event listeners
    document.getElementById("reloadBtn").onclick = () => loadAll();
    document.getElementById("searchBtn").onclick = searchFaq;
    document.getElementById("searchInput").addEventListener("keypress", e => e.key === "Enter" && searchFaq());

    // Load data
    loadAll();
</script>
</body>
</html>
